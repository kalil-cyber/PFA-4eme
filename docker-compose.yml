services:
  postgres:
    image: postgres:16-alpine
    container_name: tariki-db
    environment:
      POSTGRES_USER: tariki
      POSTGRES_PASSWORD: tariki_secret
      POSTGRES_DB: tariki_traffic
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
