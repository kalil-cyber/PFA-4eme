# Déploiement gratuit — UN seul lien (app + API)
# https://dashboard.render.com/blueprint/new → repo kalil-cyber/PFA-4eme
services:
  - type: web
    name: tariki
    runtime: node
    plan: free
    buildCommand: bash scripts/render-build.sh
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: USE_MEMORY
        value: "true"
      - key: TARIKI_DEFAULT_DAY
        value: monday
      - key: ADMIN_ACCESS_CODE
        value: "0000"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOW_VERCEL
        value: "true"
      - key: SIMULATION_INTERVAL_MS
        value: "3000"
