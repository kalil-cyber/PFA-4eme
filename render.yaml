# Deploiement gratuit — un seul lien (app + API)
# https://dashboard.render.com/blueprint/new → repo kalil-cyber/PFA-4eme
services:
  - type: web
    name: kalil-nutrition
    runtime: node
    plan: free
    buildCommand: bash scripts/render-build.sh
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: ADMIN_ACCESS_CODE
        value: "0000"
      - key: CORS_ALLOW_VERCEL
        value: "true"
